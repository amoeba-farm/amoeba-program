[target.sbpf-solana-solana]
rustflags = [
    "-Z",
    "fmt-debug=none",
    "-Z",
    "location-detail=none",
    "-Z",
    "mir-opt-level=1",
    "-C",
    "llvm-args=-enable-global-merge-func -enable-merge-functions",
    "-C",
    "link-arg=--icf=all",
]

[target.sbpfv1-solana-solana]
rustflags = [
    "-Z",
    "fmt-debug=none",
    "-Z",
    "location-detail=none",
    "-Z",
    "mir-opt-level=1",
    "-C",
    "llvm-args=-enable-global-merge-func -enable-merge-functions",
    "-C",
    "link-arg=--icf=all",
]

# The verified build mounts this program directory as a self-contained crate.
[env]
AMEBA_MAINNET_PROFILE_RS = { value = "mainnet-profile.rs", relative = true }
