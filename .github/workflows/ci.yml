name: Public source CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: public-source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.90.0
          components: rustfmt
      - name: Verify the production-only public source
        run: |
          cargo fmt --manifest-path programs/light_token_minter/Cargo.toml --all -- --check --config reorder_modules=false
          cargo check --manifest-path programs/light_token_minter/Cargo.toml --locked --lib --features devnet-v3-governance-controller,devnet-solo-backfill-2026
          (cd programs/light_token_minter && cargo check --locked --lib --no-default-features --features mainnet-v3,devnet-solo-backfill-2026)
      - name: Reject binaries and private development surfaces
        shell: bash
        run: |
          set -euo pipefail
          test -f PUBLIC_SOURCE_PROVENANCE.json
          test "$(git ls-files '*.so')" = ""
          test ! -e clients
          test ! -e scripts
          test ! -e programs/light_token_minter/tests
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path("programs/light_token_minter")
          guard = '''#[cfg(all(
              feature = "mainnet-v3",
              any(
                  feature = "devnet-v3-governance-controller",
                  feature = "phase3-synthetic-governance-controller",
                  feature = "reviewed-governance-controller",
                  feature = "local-ceremony-governance-controller",
                  feature = "test-sbf"
              )
          ))]
          compile_error!("mainnet-v3 excludes other controllers and test timing capabilities");'''
          # The sole permitted test-sbf mention rejects that feature on Mainnet.
          for path in [root / "Cargo.toml", *sorted((root / "src").rglob("*.rs"))]:
              text = path.read_text()
              if path == root / "src/lib.rs":
                  assert text.count(guard) == 1, "Mainnet exclusion guard changed"
                  text = text.replace(guard, "")
              assert not re.search(r"#\[(cfg\()?test|developer-ops|test-sbf", text), str(path)
          PY
