[package]
name = "ameba-commodity-spec"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "RAMX, NANDX and BATX commodity buckets, comparison-series and observation formats, the deterministic submission routing of governance/commodity_submission_spec.v1.json and governance/batx_basket_spec.v1.json, BATX's fixed-base index, and the channel molds of the long-term agreement layer (governance/channel_molds.v1.json)"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
ameba-oracle-heads.workspace = true
sha2 = "0.10"
