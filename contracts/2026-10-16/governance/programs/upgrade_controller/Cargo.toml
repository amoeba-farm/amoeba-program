[package]
name = "upgrade_controller"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[features]
no-entrypoint = []
# Test-only resource-measurement build. This never changes the instruction or
# account ABI; it permits the three nonselected ProgramData observation chunk
# candidates only so the production append processor can be measured as actual
# controller SBF. Release builds and checked artifacts do not enable it.
programdata-observation-chunk-matrix = []

[dependencies]
borsh.workspace = true
solana-program.workspace = true
solana-loader-v3-interface.workspace = true
solana-pubkey.workspace = true
solana-sdk-ids.workspace = true
solana-system-interface.workspace = true
thiserror.workspace = true

[dev-dependencies]
base64 = "=0.22.1"
bincode = "=1.3.3"
serde.workspace = true
serde_json.workspace = true
solana-client = "=2.3.13"
solana-address-lookup-table-interface = { version = "=2.2.2", features = ["bincode"] }
solana-nonce = "=2.2.1"
solana-program-test = "=2.3.13"
solana-sdk = "=2.3.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints.rust.unexpected_cfgs]
level = "allow"
check-cfg = ['cfg(target_os, values("solana"))']
