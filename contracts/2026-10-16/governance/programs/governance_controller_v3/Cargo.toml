[package]
name = "governance_controller_v3"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[features]
no-entrypoint = []
localnet-governance = ["ameba-governance-interface/localnet-governance"]

[dependencies]
ameba-governance-interface = { path = "../../crates/governance-interface" }
borsh.workspace = true
solana-program.workspace = true
solana-loader-v3-interface.workspace = true
solana-sdk-ids.workspace = true
solana-system-interface.workspace = true
upgrade_controller = { path = "../upgrade_controller", features = ["no-entrypoint"] }

[dev-dependencies]
bincode = "=1.3.3"
solana-program-test = "=2.3.13"
solana-sdk = "=2.3.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints.rust.unexpected_cfgs]
level = "allow"
check-cfg = ['cfg(target_os, values("solana"))']
