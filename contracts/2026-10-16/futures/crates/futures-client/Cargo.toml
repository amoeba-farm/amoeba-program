solana-sdk-ids = "2.2.1"
ameba-oracle-interface.workspace = true
ameba-futures = { path = "../../programs/futures", features = ["no-entrypoint"] }
ameba-futures-math = { path = "../futures-math" }

[lints]
workspace = true
