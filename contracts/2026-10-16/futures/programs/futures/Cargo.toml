[package]
name = "ameba-futures"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Ameba futures market: range claims on [lo, hi), exact package matching with on-chain verification, a funded maker ladder, USDC custody and settlement"

[lib]
crate-type = ["cdylib", "lib"]

[features]
# The dev chain's build: governance on the localnet controller, and the
# legacy per-market Earn pools' exit (their shares on the dev chain).
localnet-governance = ["ameba-governance-interface/localnet-governance", "legacy-pools"]
# Dev only: `PoolWithdraw`, `PoolMigrate` and the operator's cancels for the
# per-market Earn pools the dev chain still holds. Never in production.
legacy-pools = []
default = ["custom-heap"]
no-entrypoint = []
# The program brings its own upward bump allocator (src/heap.rs), so the
# instructions that verify packages can use a requested 256 KiB heap frame
# while every other instruction stays inside the default 32 KiB.
custom-heap = []
# Logs remaining compute at the stages of `Submit` (profiling builds only).
cu-trace = []

[dependencies]
ameba-governance-interface = { path = "../../../governance/crates/governance-interface" }
borsh.workspace = true
solana-program.workspace = true
solana-system-interface.workspace = true
spl-token.workspace = true
solana-sdk-ids = "2.2.1"
ameba-futures-math = { path = "../../crates/futures-math" }
ameba-oracle-interface.workspace = true

[lints]
workspace = true
